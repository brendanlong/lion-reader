services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: lionreader
      POSTGRES_USER: lionreader
      POSTGRES_PASSWORD: lionreader
    ports:
      - "5432:5432"
    volumes:
      # Named per major version so upgrading leaves the old major's volume behind.
      - postgres18_data:/var/lib/postgresql
      - ./scripts/docker-init-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lionreader -d lionreader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Object storage (STORAGE_* in .env.example), which ebook imports need.
  # Keeps objects only while running.
  s3:
    image: adobe/s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: lion-reader,lion-reader-archive
    ports:
      - "9090:9090"

volumes:
  postgres18_data:
  redis_data:
