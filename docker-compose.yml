services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: lionreader
      POSTGRES_USER: lionreader
      POSTGRES_PASSWORD: lionreader
    ports:
      - "5432:5432"
    volumes:
      # Named per major version: an older major's data directory won't start.
      - postgres18_data:/var/lib/postgresql
      - ./scripts/docker-init-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lionreader -d lionreader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres18_data:
  redis_data:
