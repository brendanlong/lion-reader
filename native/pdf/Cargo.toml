[package]
name = "lion-reader-pdf"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

# Unlike the other native crates this is an executable, not an N-API module:
# src/main.rs says why. native/build.mjs copies it to native/pdf/lion-reader-pdf.
[workspace]

[dependencies]
# default-features = false drops ICC color management, which text extraction
# doesn't need. legacy-crypto (RC4) stays: plenty of PDFs are "encrypted" with
# an empty user password just to set permissions, and many of those use RC4.
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }
libc = "0.2"
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
