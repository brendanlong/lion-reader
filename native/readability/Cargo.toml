[package]
name = "lion-reader-readability"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

# Unlike the other N-API crates there is no pure-logic core sub-crate: the
# extraction algorithm lives in the dom_smoothie dependency and the wrapper's
# behavior is covered by the TS tests (tests/unit/content-cleaner.timing.test.ts).

[lib]
crate-type = ["cdylib"]

[dependencies]
# Fork until niklak/dom_smoothie#254 and #256 are released (#2345): upstream drops
# section headings whose class contains "header" (Substack's
# `header-anchor-post`). The fork also extends #254 to h1/h4-h6.
dom_smoothie = { git = "https://github.com/brendanlong/dom_smoothie", rev = "cbc0e0e3b1078c63e58067f73cc1a13358938389" }
napi = { version = "3.16.2", default-features = false, features = ["napi8"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2"
