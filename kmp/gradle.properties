org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
# iOS tests need macOS; the iOS targets still compile everywhere.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true

# The only connected (on-device) test is the baseline profile generator, which
# drives the debug app a developer has signed in; uninstalling it afterwards
# would sign them out.
android.injected.androidTest.leaveApksInstalledAfterRun=true
