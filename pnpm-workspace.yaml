packages:
  - .
  # Native (Rust) modules - loader + typings; the .node binaries are built by
  # `pnpm build:native` (cargo), not by pnpm.
  - native/sanitizer
  - native/readability
  - native/feed-parser
  - native/markdown
  - native/speech-encoder

# Supply-chain: only resolve package versions that have been on the registry for at
# least this many minutes (10080 = 7 days), giving a compromised release time to be
# caught and yanked before it reaches us. pnpm skips in-window versions and picks the
# newest one that has cleared the cooldown, so `pnpm add`/`update` need no special
# handling. Set here (not per-machine global config) so everyone resolves identically.
# We deliberately keep this applied to every package — high-usage, high-frequency
# deps are the most attractive targets, so there's no minimumReleaseAgeExclude.
minimumReleaseAge: 10080

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - "@sentry/cli"
  - argon2
  - esbuild
  - protobufjs

# Transitive dependencies pinned above a vulnerable range. A dependency only
# needs an entry here while its parent still resolves below the patched
# version — once the parent's own range catches up, drop the override rather
# than leaving a floor nobody is enforcing.
overrides:
  trpc-to-openapi>h3: ^1.15.9
  serialize-javascript: ^7.0.5
  "@modelcontextprotocol/sdk>hono": ^4.13.5
  "@modelcontextprotocol/sdk>@hono/node-server": ^1.19.15
  express-rate-limit>ip-address: ^10.7.1
  "@discordjs/ws>ws": ^8.20.1
  qs: ^6.16.0
  express>body-parser: ^2.3.0
  postcss: ^8.5.10
  fast-xml-parser: ^5.8.0
  js-yaml: ^4.3.1
  fast-uri: ^3.1.8
  browserslist@4: ^4.28.7
  "@babel/core@7": ^7.29.6
  "@humanfs/node@0": ^0.16.8
  # brace-expansion is pulled in at three majors at once, and the advisory
  # patches each separately, so it needs one floor per major rather than a
  # single range that would drag 1.x/2.x consumers onto 5.x.
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
