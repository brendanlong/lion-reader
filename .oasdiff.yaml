# Read by the `openapi-breaking` CI job (oasdiff runs from the repo root).
#
# A new member of a response oneOf is not breaking for our clients: the only
# oneOf is the sync event union, and the native app skips event types it
# doesn't know (`parseSyncEvent`). New response enum values stay errors, since
# the app decodes those into closed Kotlin enums.
severity-levels: .github/oasdiff-severity-levels.txt
# Breaking changes checked against the models of every app build still in use
# and found safe (those builds don't require what they remove). Each line is one
# change as oasdiff prints it, matched literally, so it only waives that exact
# change.
err-ignore: .github/oasdiff-err-ignore.txt
