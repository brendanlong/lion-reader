name: Android Release

# Tag a commit android-vX.Y.Z to release the app, or run this workflow by hand
# with the version (it builds the branch it's run on and tags it): this builds
# the signed app bundle (for Play, kept as an artifact) and APK (attached to a
# GitHub release). Setup, secrets and the Play steps: "Android app releases" in
# docs/DEPLOYMENT.md.

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (tagged android-vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The previous android-v tag, for the release notes.
          fetch-depth: 0
          # The write token stays out of git's config, away from the build.
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      # versionCode must only ever go up; X.Y.Z → X*1000000 + Y*1000 + Z. No
      # leading zeros (bash would read 010 as octal), and X stays below 2100
      # (Play's limit is 2100000000).
      - name: Version
        id: version
        env:
          # Through the environment, never pasted into the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#android-v}"
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,2}|1[0-9]{3}|20[0-9]{2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::The version must be X.Y.Z (no leading zeros; X below 2100, Y and Z below 1000), not $VERSION"
            exit 1
          fi
          TAG="android-v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists; pick a higher version"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_RELEASE_KEYSTORE_BASE64 secret isn't set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Apart from the build, so tests never run with the signing secrets.
      - name: Check
        run: ./gradlew check

      - name: Build
        env:
          ORG_GRADLE_PROJECT_lionReaderVersionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_lionReaderVersionCode: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_lionReaderReleaseKeystore: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_lionReaderReleaseKeystorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_lionReaderReleaseKeyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_lionReaderReleaseKeyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease

      - name: Collect outputs
        id: outputs
        run: |
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          NAME="lion-reader-${{ steps.version.outputs.name }}"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$OUT/$NAME.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "$OUT/$NAME.aab"
          cp androidApp/build/outputs/mapping/release/mapping.txt "$OUT/$NAME-mapping.txt"
          # The signing certificate, and its fingerprint in the AA:BB:… form
          # ANDROID_APP_CERT_SHA256 on the server takes.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$OUT/$NAME.apk" > "$OUT/certificate.txt"
          FINGERPRINT=$(sed -n 's/.*SHA-256 digest: //p' "$OUT/certificate.txt" | head -1 \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::Couldn't read the APK's signing certificate"
            exit 1
          fi
          echo "ANDROID_APP_CERT_SHA256 fingerprint: $FINGERPRINT" | tee -a "$OUT/certificate.txt"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT/$NAME.apk" >> "$GITHUB_OUTPUT"

      # For Play (upload the bundle) and for decoding stack traces (mapping).
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-release-${{ steps.version.outputs.name }}
          path: ${{ steps.outputs.outputs.dir }}

      # Not "latest": that stays the weekly server release. A re-run replaces the
      # APK on the release it already made.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The android-v tag this commit's history reaches (a hotfix on an
          # older line gets its own line's), if any.
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'android-v*' --exclude "$TAG" HEAD 2>/dev/null || true)
          {
            echo "Lion Reader for Android ${{ steps.version.outputs.name }}. Download the APK below to install it directly."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "## App changes since $PREVIOUS"
              git log --no-merges --pretty='- %s' "$PREVIOUS..HEAD" -- .
            fi
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.outputs.outputs.apk }}" --clobber
          else
            # Creates the tag too, on a manual run.
            gh release create "$TAG" "${{ steps.outputs.outputs.apk }}" \
              --target "$GITHUB_SHA" \
              --title "Android ${{ steps.version.outputs.name }}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest=false
          fi
