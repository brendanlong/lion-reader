name: Android Release

# Tag a commit android-vX.Y.Z to release the app: this builds the signed app
# bundle (for Play, kept as an artifact) and APK (attached to a GitHub release).
# Setup, secrets and the Play steps: "Android app releases" in docs/DEPLOYMENT.md.

on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The previous android-v tag, for the release notes.
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      # versionCode must only ever go up; X.Y.Z → X*1000000 + Y*1000 + Z.
      - name: Version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "::error::Tag must be android-vX.Y.Z (minor and patch below 1000), not $GITHUB_REF_NAME"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_RELEASE_KEYSTORE_BASE64 secret isn't set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Check and build
        env:
          ORG_GRADLE_PROJECT_lionReaderVersionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_lionReaderVersionCode: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_lionReaderReleaseKeystore: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_lionReaderReleaseKeystorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_lionReaderReleaseKeyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_lionReaderReleaseKeyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew check :androidApp:bundleRelease :androidApp:assembleRelease

      - name: Collect outputs
        id: outputs
        run: |
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          NAME="lion-reader-${{ steps.version.outputs.name }}"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$OUT/$NAME.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "$OUT/$NAME.aab"
          cp androidApp/build/outputs/mapping/release/mapping.txt "$OUT/$NAME-mapping.txt"
          # The signing certificate, and its fingerprint in the AA:BB:… form
          # ANDROID_APP_CERT_SHA256 on the server takes.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$OUT/$NAME.apk" > "$OUT/certificate.txt"
          FINGERPRINT=$(sed -n 's/.*SHA-256 digest: //p' "$OUT/certificate.txt" | head -1 \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "ANDROID_APP_CERT_SHA256 fingerprint: $FINGERPRINT" | tee -a "$OUT/certificate.txt"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT/$NAME.apk" >> "$GITHUB_OUTPUT"

      # For Play (upload the bundle) and for decoding stack traces (mapping).
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-release-${{ steps.version.outputs.name }}
          path: ${{ steps.outputs.outputs.dir }}

      # Not "latest": that stays the weekly server release.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(git tag --list 'android-v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          {
            echo "Lion Reader for Android ${{ steps.version.outputs.name }}. Download the APK below to install it directly."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "## App changes since $PREVIOUS"
              git log --no-merges --pretty='- %s' "$PREVIOUS..$GITHUB_REF_NAME" -- .
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "${{ steps.outputs.outputs.apk }}" \
            --title "Android ${{ steps.version.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false
