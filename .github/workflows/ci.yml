name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      # These run even when an earlier check fails, so one push surfaces every
      # problem instead of one per round-trip.

      # The husky pre-commit hook also formats, but it is bypassable
      # (`--no-verify`, or edits from tools that skip hooks), so gate it here.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Check for unused files, exports, and dependencies
        if: ${{ !cancelled() }}
        run: pnpm knip

      - name: Check for production-unreachable code
        if: ${{ !cancelled() }}
        run: pnpm knip:production

      - name: Check for raw color utilities
        if: ${{ !cancelled() }}
        run: pnpm check:colors

  # The Rust `.node` binaries depend only on native/, so build them once here
  # and share them with every job that needs them instead of paying for three
  # independent cargo builds. The cache makes even that one build a no-op when
  # native/ is unchanged; the artifact is what downstream jobs consume, so they
  # never depend on a cache hit.
  #
  # Trade-off: a PR that *does* touch native/ pays one cold cargo build on the
  # critical path ahead of the test jobs, rather than in parallel inside each.
  # Total runner minutes still drop; wall clock for those PRs is slightly worse.
  build-native:
    name: Build Native Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restore native modules
        id: native-cache
        uses: actions/cache@v6.1.0
        with:
          path: native/*/*.node
          key: native-modules-${{ runner.os }}-${{ hashFiles('native/**', 'rust-toolchain.toml') }}

      - uses: pnpm/action-setup@v6.1.0
        if: steps.native-cache.outputs.cache-hit != 'true'

      - uses: actions/setup-node@v7.0.0
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build native modules
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: pnpm build:native

      # Retention must outlive a plausible "Re-run failed jobs": that reruns
      # only the failed job, so an expired artifact here breaks the download in
      # every downstream job with no way to regenerate it short of a full rerun.
      - name: Upload native modules
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-modules
          path: native/*/*.node
          retention-days: 7

  # The Rust suites gate merges on their own, separately from build-native:
  # that job short-circuits on a cache hit, and a check that can be skipped is
  # not a gate. native/sanitizer is our primary XSS defense (SECURITY.md §1)
  # and its allow-list and escaping tests live in the crate, so a PR must not
  # be able to redden them and still merge.
  rust-checks:
    name: Rust Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # No toolchain setup step: the runner's rustup installs the version
      # rust-toolchain.toml pins on the first cargo call.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Without this a red run saves nothing, so a PR iterating on a Rust
          # failure never warms its own branch cache.
          cache-on-failure: true
          workspaces: |
            native/feed-parser
            native/markdown
            native/readability
            native/sanitizer

      # First because it compiles nothing: a misformatted PR fails in seconds
      # rather than after the test and clippy builds. The husky pre-commit hook
      # also formats Rust, but it is bypassable (`--no-verify`, or edits from
      # tools that skip hooks), so gate it here.
      - name: Check formatting
        run: ./scripts/cargo-native.sh fmt --all --check

      # These run even when an earlier check fails, so one push surfaces every
      # problem instead of one per round-trip.
      #
      # Invoked directly rather than through `pnpm test:native` / `pnpm
      # lint:native` so the job needs no Node toolchain; keep them in sync.
      - name: Run Rust tests
        if: ${{ !cancelled() }}
        run: ./scripts/cargo-native.sh test --workspace

      - name: Run clippy
        if: ${{ !cancelled() }}
        run: ./scripts/cargo-native.sh clippy --workspace --all-targets -- -D warnings

      # The stage is just `apk add rust` plus the check, so this costs a pull
      # and no cargo build. Without it, a base-image bump that moves Alpine's
      # rustc off the pin is green here and red in the deploy build.
      - name: Check the pin still matches the image's rustc
        if: ${{ !cancelled() }}
        run: docker build --target rust-base .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native modules
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-modules
          path: native/

      - name: Run unit tests
        run: pnpm test:unit

  build-extension:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build release extension
        run: bash extension/build.sh --release

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: lion-reader-chrome
          path: extension/lion-reader-chrome.zip

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v7
        with:
          name: lion-reader-firefox
          path: extension/lion-reader-firefox.zip

  openapi-breaking:
    # docs/api/openapi.json is the contract installed native apps are built
    # against; they lag the server by months, so a breaking change strands them.
    # (Staleness of the snapshot itself is checked by the integration tests.)
    name: OpenAPI Breaking Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check for a base snapshot
        id: base
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:docs/api/openapi.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oasdiff/oasdiff-action/breaking@v0
        if: steps.base.outputs.exists == 'true'
        with:
          base: "origin/${{ github.base_ref }}:docs/api/openapi.json"
          revision: "HEAD:docs/api/openapi.json"
          fail-on: ERR

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-native
    # Service credentials mirror docker-compose.yml / .env.test so the job can
    # run `pnpm test:integration` exactly as developers do locally (migrations,
    # schema dump, and env all come from .env.test).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lionreader_test
          POSTGRES_USER: lionreader
          POSTGRES_PASSWORD: lionreader
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native modules
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-modules
          path: native/

      # The schema dump refuses a server newer than its pg_dump, and the
      # runner's preinstalled client is older than the service. PATH (not
      # pg_wrapper, which can resolve to the runner's own 5432 cluster) pins it.
      - name: Install pg_dump matching the postgres service
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Run integration tests
        run: pnpm test:integration

  app-real-server-tests:
    # The native app's shared core (kmp/shared) against this revision's server
    # over real HTTP: catches API changes that break the app, which the
    # OpenAPI diff alone can't (behavior, not just shape).
    name: App Real-Server Tests
    runs-on: ubuntu-latest
    needs: build-native
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lionreader_test
          POSTGRES_USER: lionreader
          POSTGRES_PASSWORD: lionreader
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      APP_URL: http://localhost:4990

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native modules
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-modules
          path: native/

      - name: Migrate
        run: pnpm db:migrate:test

      - name: Start server
        run: |
          PORT=4990 NEXT_PUBLIC_APP_URL="$APP_URL" pnpm exec dotenv -o -e .env.test -- pnpm dev:next > server.log 2>&1 &
          timeout 180 bash -c 'until curl -sf "$APP_URL/api/health" > /dev/null; do sleep 2; done'

      - name: Run real-server tests
        run: |
          export LION_READER_TEST_FIXTURE="$(NEXT_PUBLIC_APP_URL="$APP_URL" pnpm exec dotenv -o -e .env.test -- pnpm -s app:test-fixture)"
          cd kmp && ./gradlew :shared:jvmTest --tests '*RealServerTest*'
          # The test skips itself without a fixture; make sure it really ran.
          grep -q 'skipped="0"' shared/build/test-results/jvmTest/TEST-com.lionreader.shared.sync.RealServerTest.xml

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-real-server-log
          path: server.log

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-native
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lionreader_test
          POSTGRES_USER: lionreader
          POSTGRES_PASSWORD: lionreader
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native modules
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-modules
          path: native/

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Build the production server so e2e exercises the deployed code path
      # (next build + node dist/server.js with the compression wrapper), not
      # the dev server. playwright.config.ts switches to `pnpm start` when CI
      # is set. The database URLs are only validated at build time, not used.
      - name: Build production server
        run: pnpm build && pnpm build:server
        env:
          DATABASE_URL: postgresql://lionreader:lionreader@localhost:5432/lionreader_test
          REDIS_URL: redis://localhost:6379

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
