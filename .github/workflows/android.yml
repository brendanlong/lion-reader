name: Android

# kmp/scripts only generate checked-in files, so a change to their output
# still triggers this.
on:
  push:
    branches: [master]
    paths:
      - "kmp/**"
      - "!kmp/**/*.md"
      - "!kmp/scripts/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [master]
    paths:
      - "kmp/**"
      - "!kmp/**/*.md"
      - "!kmp/scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and Build
    runs-on: ubuntu-latest
    outputs:
      apk-url: ${{ steps.upload.outputs.artifact-url }}
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v7.0.1

      # Matches gradle/gradle-daemon-jvm.properties and the toolchain version in
      # the catalog, so Gradle finds it instead of provisioning another JDK.
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the wrapper jar. Writes the cache only on master.
      - uses: gradle/actions/setup-gradle@v6.4.0

      # The runner image's Android SDK has its licenses accepted, so AGP
      # installs the compile SDK / build tools it needs on first use.
      # The release build (unsigned here) runs R8, so shrinking problems show
      # up in pull requests rather than at release time.
      - name: Check and assemble release
        run: ./gradlew check assembleRelease

      # Apart from the checks, so tests never run with the key. Signed with the
      # shared dev key (see "Debug app and signing" in kmp/CLAUDE.md), so the
      # APK installs over any other debug build and can sign in to production.
      # Pull requests from forks get no secrets: theirs uses the default debug
      # key and isn't uploaded.
      - name: Assemble debug
        id: debug
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: |
          # Nothing the checks left running is around to read the key.
          ./gradlew --stop
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dev.jks"
            export ORG_GRADLE_PROJECT_lionReaderDevKeystore="$RUNNER_TEMP/dev.jks"
            export ORG_GRADLE_PROJECT_lionReaderDevKeystorePassword="$DEV_KEYSTORE_PASSWORD"
            export ORG_GRADLE_PROJECT_lionReaderDevKeyAlias="$DEV_KEY_ALIAS"
            export ORG_GRADLE_PROJECT_lionReaderDevKeyPassword="$DEV_KEY_PASSWORD"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew assembleDebug

      - name: Upload debug APK
        id: upload
        if: steps.debug.outputs.signed == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lion-reader-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: kmp/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-reports
          path: kmp/*/build/reports/

  # Its own job, so only this one (not the build, which runs the tests) can
  # write to the pull request.
  debug-apk-link:
    name: Link the debug APK
    needs: check
    if: needs.check.outputs.apk-url != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # One comment per pull request, updated on each push.
      - name: Comment and summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          URL: ${{ needs.check.outputs.apk-url }}
        run: |
          MARKER="<!-- android-debug-apk -->"
          BODY="$MARKER
          📱 **Debug APK** for ${SHA:0:7}: [download]($URL) (a zip with the APK in it; kept 30 days). Signed with the shared dev key, so it installs over any other debug build and can sign in to production."
          BODY=$(printf '%s\n' "$BODY" | sed 's/^ *//')
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$PR" ] || exit 0
          ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi
