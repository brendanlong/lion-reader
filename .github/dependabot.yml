# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days for other people to find security problems
    # https://daniakash.com/posts/simplest-supply-chain-defense/
    cooldown:
      default-days: 7
    # React refuses to run unless react and react-dom are the *exact* same
    # version, so a PR that bumps one and not the other fails every React
    # unit test with "Incompatible React versions". Group them (plus their
    # types) so they always move together. Groups default to version
    # updates, so security updates need their own entry.
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Every npm PR rewrites pnpm-lock.yaml, and two of them merged from
      # stale bases combine textually into a lockfile with a duplicated key
      # that no longer parses — which took CI and deploys down (#1501). One
      # grouped PR per week means one lockfile rewrite to land, not six
      # racing each other. Majors stay ungrouped: they need individual
      # review, and a single bad one shouldn't hold the rest hostage.
      #
      # Security updates are deliberately left ungrouped (apart from React
      # above) so a fix can land on its own without waiting for the batch.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        # A dependency joins every group it matches, so React has to be
        # excluded here or it would land in two PRs at once.
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
